# New Relic Python agent config (I5.8 — APM).
#
# Safe to commit: no secret lives here. license_key and app_name are
# DELIBERATELY ABSENT below -- not blank, not a placeholder, genuinely not
# present as keys in [newrelic]. This is load-bearing, not an oversight:
#
#   newrelic/core/config.py sets _settings.license_key and .app_name from
#   NEW_RELIC_LICENSE_KEY / NEW_RELIC_APP_NAME at import time -- but
#   newrelic/config.py's ini loader then overwrites _settings with the
#   *literal text* of any key actually present in this file, unconditionally,
#   with zero env-var interpolation. There is no "%(VAR)s" substitution and
#   no "env var wins" behavior -- an earlier version of this file had
#   `license_key = REPLACE_WITH_ENV_VAR` and the agent sent that literal
#   placeholder string to New Relic's collector as the license key, silently,
#   for every run, regardless of what NEW_RELIC_LICENSE_KEY actually held.
#   Confirmed directly via `newrelic.agent.global_settings()` after a real
#   license key was still rejected twice. If you add either key back to this
#   file with any value (including an empty one), you will reintroduce that
#   bug. NEW_RELIC_LICENSE_KEY (backend/.env, never committed) and
#   NEW_RELIC_APP_NAME (docker-compose.yml, per service) are the only place
#   these two settings should ever be set.
#
# With no license key in the environment, the agent loads, finds nothing to
# report, and stays inert — same "no-op unless configured" contract as
# Sentry (app/core/observability.py) and Prometheus (app/core/metrics.py).
#
# Loaded via NEW_RELIC_CONFIG_FILE (see docker-entrypoint.sh + docker-compose.yml).
# Full reference: https://docs.newrelic.com/docs/apm/agents/python-agent/configuration/python-agent-configuration/

[newrelic]
# Distributed tracing links API -> worker/scheduler -> outbound HTTP (OpenAI,
# WordPress, Shopify, GSC) into one trace. Keep on.
distributed_tracing.enabled = true

# High-security accounts should keep this off; standard accounts may enable
# transaction-level SQL/query capture if desired. Off by default here since
# storage.py wraps MongoDB, not SQL, and query strings can carry document data.
transaction_tracer.record_sql = off

# Don't ship request/response bodies or arbitrary custom params containing
# secrets — matches the PII stance in app/core/observability.py's Sentry setup.
attributes.exclude = request.headers.authorization, request.headers.cookie, request.headers.set-cookie

# structlog/stdlib logs already flow to stdout as JSON (I5.3); let the agent
# forward them into New Relic Logs and correlate by trace id, without
# duplicating a second log pipeline. local_decorating is OFF on purpose: it
# splices an "NR-LINKING|..." marker directly into each log line's message
# text, which turns every line into invalid JSON -- breaks structlog's JSON
# stdout format, RequestIdMiddleware correlation, and anything that greps
# request_id out of the logs (I5.3). forwarding alone still ships every log
# line to New Relic Logs and correlates it by trace id server-side, without
# touching local stdout at all. (Verified locally: with local_decorating on,
# `{"event": "...", ...}` lines became `... NR-LINKING||||||` plain text.)
application_logging.enabled = true
application_logging.forwarding.enabled = true
application_logging.local_decorating.enabled = false

log_level = info
# Container-friendly: write agent diagnostics to stdout, not a file the
# volume doesn't own.
log_file = stdout

# No [newrelic:production] / [newrelic:staging] sections: they existed only to
# override app_name per environment, which is the exact setting that must
# never appear in this file (see the top-of-file note). NEW_RELIC_ENVIRONMENT
# is unused by this config; per-environment naming is achieved entirely
# through NEW_RELIC_APP_NAME in docker-compose.yml.
